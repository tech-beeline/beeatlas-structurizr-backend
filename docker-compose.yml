version: '3.7'
services:

  structurizr_backend:
    tty: true
    container_name: structurizr_backend
    volumes:
      - .:/opt/structurizr_backend
    build:
      context: .
      dockerfile: Dockerfile.test
    ports:
      - 8080:8080
    env_file: ".env_dev"
    networks:
      - structurizr_backend_network
         
networks:
  structurizr_backend_network:
    driver: "bridge"
    external: false