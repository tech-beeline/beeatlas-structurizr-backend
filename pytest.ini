[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    integration: integration tests that touch real external systems (skipped by default).
